<div class="modal-overlay" *ngIf="isOpen" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Edit Food Entry</h2>
      <button class="close-btn" (click)="onCancel()">✕</button>
    </div>

    <form [formGroup]="editForm" class="modal-body">
      <div class="form-group">
        <label for="name">Food Name <span class="required">*</span></label>
        <input 
          type="text" 
          id="name" 
          formControlName="name"
          class="form-control"
          [class.is-invalid]="f['name'].touched && f['name'].errors"
          placeholder="e.g., apple">
        <div class="error-message" *ngIf="f['name'].touched && f['name'].errors">
          <span *ngIf="f['name'].errors?.['required']">Food name is required</span>
        </div>
      </div>

      <div class="form-group">
        <label for="calorie">Calorie <span class="required">*</span></label>
        <input 
          type="number" 
          id="calorie" 
          formControlName="calorie"
          class="form-control"
          [class.is-invalid]="f['calorie'].touched && f['calorie'].errors"
          placeholder="e.g., 95">
        <div class="error-message" *ngIf="f['calorie'].touched && f['calorie'].errors">
          <span *ngIf="f['calorie'].errors?.['required']">Calorie is required</span>
          <span *ngIf="f['calorie'].errors?.['min'] || f['calorie'].errors?.['max']">Calorie must be between 1 and 10000</span>
        </div>
      </div>

      <div class="form-group">
        <label for="note">Note (optional)</label>
        <input 
          type="text" 
          id="note" 
          formControlName="note"
          class="form-control"
          placeholder="e.g., medium sized">
      </div>
    </form>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="onSave()" [disabled]="editForm.invalid">Save</button>
    </div>
  </div>
</div>
