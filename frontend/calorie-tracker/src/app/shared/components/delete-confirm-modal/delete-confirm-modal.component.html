<div class="modal-overlay" *ngIf="isOpen" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Delete Food Entry</h2>
      <button class="close-btn" (click)="onCancel()">✕</button>
    </div>

    <div class="modal-body">
      <p class="message">Are you sure you want to delete this food entry?</p>
      <div class="food-details" *ngIf="foodItem">
        <div class="detail-item">
          <span class="label">Food:</span>
          <span class="value">{{ foodItem.name }}</span>
        </div>
        <div class="detail-item">
          <span class="label">Calorie:</span>
          <span class="value">{{ foodItem.calorie }} kcal</span>
        </div>
      </div>
      <p class="warning">This action cannot be undone.</p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn btn-danger" (click)="onConfirm()">Delete</button>
    </div>
  </div>
</div>
