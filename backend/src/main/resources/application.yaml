spring:
  application:
    name: calorie-tracker-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: calorie_tracker

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production-min-32-chars}
    expiration: ${JWT_EXPIRATION:86400000}
    header: Authorization
    prefix: Bearer

logging:
  level:
    root: INFO
    com.calorie: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized